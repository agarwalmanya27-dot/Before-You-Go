<!DOCTYPE html>
<html>

<head>

<title>Before You Go</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #061a31;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.box {
    width: 480px;
    padding: 20px 35px;
    background: #0b2948;
    border: 2px solid #4da3ff;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
}

.logo {
    width: 115px;
    height: 115px;
    object-fit:contain;
    background: white;
    padding: 10px;
    border-radius: 50%;
    margin-bottom: 12px;
}

h1 {
    margin: 5px 0 ;
    color: #1976d2;
    font-size: 36px;
}

h1 span {
    color: orange;
}

.subtitle {
    margin: 0 0 25px;
    font-size: 17px;
}

input {
    display: block;
    width: 100%;
    height: 40px;
    padding: 12px 15px;
    margin: 12px 0;

    background: #193a5d;
    color: white;

    border: 1px solid #7191b5;
    border-radius: 10px;

    font-size: 15px;
}

input::placeholder {
    color: #b8c8d9;
}

button {
    width: 100%;
    height: 48px;
    margin-top: 10px;

    background: linear-gradient(90deg, #1474e8, #18d9d1);
    color: white;

    border: none;
    border-radius: 10px;

    font-size: 17px;
    cursor: pointer;
}

.tagline {
    margin-top: 22px;
    font-size: 15px;
}

.green {
    color: #35d66c;
}

.orange {
    color: orange;
}

.blue {
    color: #20a8e8;
}

</style>

</head>


<body>

<div class="box">

    <img src="C:\Users\acer\Downloads\byg\byglogo.png.jpeg" class="logo">

    <h1>
        Before You <span>Go</span>
    </h1>

    <p class="subtitle">
        Smart Travel Management System
    </p>

    <input type="text" placeholder="Name">

    <input type="email" placeholder="Email">

    <input type="password" placeholder="Password">

    <button>
        Login
    </button>

    <p class="tagline">
        Plan <span class="green">Smart</span>
        &nbsp;&nbsp;
        Travel <span class="orange">Better</span>
        &nbsp;&nbsp;
        Explore <span class="blue">More</span>
    </p>

</div>

</body>

</html>
